<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stripe setup</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f5f7fb;color:#111;margin:0;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);max-width:420px;width:100%;padding:32px;text-align:center}
  .check{width:64px;height:64px;border-radius:50%;background:#e7f7ee;color:#12a150;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 16px}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#555;font-size:16px;line-height:1.5;margin:0}
</style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>You're all set</h1>
    <p>Your Stripe setup is complete. You can close this window and return to the Festival POS app — tap <b>Refresh status</b> to finish connecting.</p>
  </div>
</body>
</html>
